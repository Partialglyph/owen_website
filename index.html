<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASCII Runner</title>
<style>
  @font-face {
    font-family: "SF Pro Display";
    src: url("fonts/SFPRODISPLAYREGULAR.OTF") format("opentype");
    font-weight: 400; font-display: swap;
  }
  @font-face {
    font-family: "SF Pro Display";
    src: url("fonts/SFPRODISPLAYBOLD.OTF") format("opentype");
    font-weight: 700; font-display: swap;
  }
  :root { --bg: #000000; --ink: #ff00ff; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--ink);
    font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont,
                 "Helvetica Neue", Arial, sans-serif;
    overflow: hidden; cursor: crosshair;
  }

  /* The stage is the upper half of the page and the character walks along its
     bottom edge, so the figure sits in open space above the link columns
     rather than in a strip of its own. */
  #stage {
    position: fixed; top: 0; left: 0;
    width: 100vw; height: 50vh;
    display: block;
  }

  .name {
    position: fixed; top: 14px; left: 24px;
    margin: 0; font-size: 17px; font-weight: 700;
    letter-spacing: 0.01em;
  }

  .cols {
    position: fixed; top: 50vh; left: 4.7vw;
    display: flex; gap: 0;
  }
  .cols section { width: 274px; }
  .cols section:first-child { width: 290px; }
  .cols h2 {
    margin: 0 0 14px; font-size: 15px; font-weight: 400;
    letter-spacing: 0.01em;
  }
  .cols a {
    display: block; margin-bottom: 8px;
    font-size: 11.5px; letter-spacing: 0.01em;
    color: var(--ink); text-decoration: none;
    opacity: 0.92; transition: opacity 0.18s ease;
  }
  .cols a:hover { opacity: 1; }
  .cols a.dl { font-style: italic; text-decoration: underline; }

  .scroll-cue {
    position: fixed; right: 26px; bottom: 22px;
    width: 16px; height: 10px;
    opacity: 0.85; pointer-events: none;
  }
  .scroll-cue svg { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>

<div class="scroll-cue" aria-hidden="true">

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

// ---------------------------------------------------------------- config
const CONFIG = {
  MODEL_RUN: "models/run.glb",
  MODEL_SLIDE: "models/slide.glb",
  MODEL_STOP: "models/stop.glb",
  // walk.glb also carries the idle clip at index 0 — verified bit-identical
  // to the separately supplied idle.glb (max abs difference 0.0 across all
  // 211 hip keyframes), so idle.glb is deliberately not loaded and the page
  // saves a redundant 2.4 MB download.
  MODEL_WALK: "models/walk.glb",
  // Mesh-free export (181 KB vs 2.4 MB) and it carries BOTH halves: clip 0 is
  // the jump, identical to the separately supplied jump.glb, so that file is
  // not loaded. Clips 1 and 2 are the same landing; 1 is used.
  MODEL_LAND: "models/landing.glb",
  // Separate Mixamo exports of the same rig; each download keeps every clip
  // picked in earlier downloads too, so the file that introduces a clip
  // carries it at a different index than later files. Matched by duration:
  // 0.667s = run, 1.583s = slide, 0.958s = stop, 8.792s = idle, 1.083s = walk.
  RUN_CLIP_IDX: 0, SLIDE_CLIP_IDX: 1, STOP_CLIP_IDX: 2,
  IDLE_CLIP_IDX: 0, WALK_CLIP_IDX: 1,
  JUMP_CLIP_IDX: 0, LAND_CLIP_IDX: 1,

  // Orthographic, not perspective — he moves left/right along a fixed lane,
  // same flat side-on read as the old sprite walker. No perspective means no
  // running toward/away from camera to worry about, and world size doesn't
  // depend on depth, which also simplifies the resolution math in resize().
  CAM_Z: 3.7,
  ORTHO_HEIGHT: 3.30,  // vertical world units the frustum shows, top to
                     // bottom. Apparent character size is inversely
                     // proportional to this: 2.19 -> 3.30 makes him ~34%
                     // smaller, so he reads as a figure standing in the open
                     // upper half rather than filling a strip.
  GROUND_MARGIN: 0.12,  // world units of floor left under his feet. The camera
                     // height is derived from this and ORTHO_HEIGHT in
                     // resize(), so the ground line stays pinned to the
                     // bottom of the stage no matter how he's scaled — a
                     // fixed CAM_Y would drift him off the edge on every
                     // size change.
  // The rig's own root already carries a 0.01 scale that converts its
  // (roughly centimeter-scale) bone data down to real meters — confirmed by
  // reading live bone transforms, not the raw pre-skinning vertex data, which
  // is in a different space and misled an earlier estimate. No extra scale
  // needed; a first attempt at "undoing" that 0.01 as if it were an artifact
  // instead re-inflated the character to ~80 meters tall.
  CHAR_SCALE: 1,
  // Was ±90°, based on a guess about the rig's forward axis that turned out
  // wrong — confirmed backward by rendering (he faced 90° off from his
  // direction of travel). 0/180 is the corrected pair.
  YAW_RIGHT: 0, YAW_LEFT: Math.PI,

  KEY_DIR: [-3, 5, 4],
  KEY_INTENSITY: 2.0,
  FILL_INTENSITY: 0.45,

  // 52 is the practical ceiling at this figure size, not a free dial. Cell
  // size is (figure height / this), and a glyph needs roughly 4.5 CSS px to
  // still read as a letterform — compared side by side at 1440x804, 52 gives
  // 4.2px cells and keeps glyph texture, 60 gives 3.6px and turns dotty, 72
  // gives 3.0px and collapses into a plain halftone dot screen with no
  // character left in it. Cells are still finer than before the shrink
  // (4.2px vs 4.6px), so absolute resolution did go up.
  GRANULARITY_SQUARES: 52,  // character height, in character cells. Derived
                     // per-resize from the band's actual height (see resize())
                     // rather than a flat px constant — a fixed cell size
                     // quietly lost resolution once before (the walker's old
                     // PIXEL bug) when its container shrank; this avoids that.
  RAMP: " .:-=+*#%@",
  GAMMA: 0.85,
  INK: [1, 0, 1],
  BG: [0, 0, 0],
  LEVELS_BLACK: 0.30,
  LEVELS_WHITE: 0.72,

  // --- movement / state machine
  // Run speed, slide distance, and the stop hand-off distance are NOT set
  // here — they're measured from each clip's own baked root motion at load
  // (see rootTravel / the `travel` object), so the character always covers
  // exactly the ground its animation was authored to cover. Hand-picked
  // values are what make feet skate.
  RUN_SPEED: 3.2,    // fallback only, if a clip has no measurable root motion
  MIN_MOVE: 0.42,    // world units (~23% of his height) the cursor must be
                     // away from him before ANY movement starts — run or
                     // slide. Small cursor drift near where he already stands
                     // shouldn't set him off. Deliberately one shared value:
                     // if the idle check in stepState used a tighter number
                     // than the pointer handler, it would immediately restart
                     // a run that handleMove had just declined.
  RETRIGGER_DIST: 0.5,  // world units — while settling into STOP, how far the
                     // cursor has to move before it's worth breaking back into
                     // a run rather than finishing the settle (SLIDE ignores
                     // this entirely: its distance is fixed once it starts)
  CROSSFADE: 0.12,   // sec, blend time between clips
  IDLE_CROSSFADE: 0.30,  // sec — longer, because settling into idle is the one
                     // transition with no urgency behind it; a fast cut there
                     // reads as a snap
  EDGE_MARGIN: 0.45, // world units of clearance kept between the character and
                     // the band's edge, so a long slide can't skid him
                     // off-screen (see boundX)
  // --- continuous locomotion.
  // Walk and run are no longer separate states picked by a speed threshold.
  // Both clips play at once and are cross-weighted by how fast he needs to
  // move, which removes the gait-switch pop entirely. Two things make this
  // work rather than turn to mush:
  //   1. A single shared phase clock drives BOTH clips, so their gait cycles
  //      stay locked. Their timeScale is set to 0 and their .time is written
  //      directly from that phase each frame.
  //   2. The clips lead with opposite feet — measured contact phases are
  //      walk L 0.800 / R 0.325 against run L 0.475 / R 0.850. Blending them
  //      naively puts one clip mid-left-step against the other's right and
  //      the legs scissor. RUN_PHASE_OFFSET realigns them.
  MOVE_GAIN: 3.2,    // desired speed = gap * this. Proportional control, so
                     // he eases off as he closes in and no explicit
                     // deceleration trigger is needed for ordinary arrivals.
  MOVE_MIN_SPEED: 0.55,  // world u/s. Below this the walk clip is playing so
                     // slowly it reads as slow motion, so he moves at least
                     // this fast or not at all.
  SPEED_SMOOTH: 9.0, // per-second rate the actual speed chases the desired
                     // one. Stops a jumpy cursor translating into jumpy gait.
  // Walk and run are not a constant phase shift of each other — run has a
  // flight phase where walk has double-support, so their feet are spaced
  // differently within the cycle. A single offset aligns one foot and leaves
  // the other ~0.2 cycle out, and a treadmill measurement put foot skate at
  // 82.7% of travel in the blend zone against 19.8% at pure walk. These two
  // control points map walk phase to run phase so BOTH contacts line up;
  // between them the run is warped slightly faster or slower. Measured
  // contacts: walk L 0.800 R 0.325, run L 0.475 R 0.850 (see __contactPhases).
  PHASE_WARP: [{ w: 0.325, r: 0.850 }, { w: 0.800, r: 1.475 }],
  MOVE_ARRIVE: 0.06, // world units — close enough to stop and settle
  // Speed range over which the gait crossfades. Deliberately NARROW, and not
  // the full walk-to-run span. Time-scaling a single clip keeps its feet
  // planted exactly; blending two clips cannot, because the average of a
  // walk-planted foot and a run-planted foot travels at neither clip's rate.
  // Measured skate: ~20% of travel on a pure gait against 67% mid-blend even
  // after phase warping. So the answer is to pass through the blend quickly
  // rather than live in it — below LO he is a time-scaled walk (up to ~1.4x
  // natural), above HI a time-scaled run (down to ~0.7x), and only the sliver
  // between is a true blend.
  BLEND_LO: 2.2, BLEND_HI: 3.8,

  JUMP_RISE_PX: 95,  // cumulative upward pointer travel, in screen px, that
                     // fires a jump. Accumulated rather than per-event so a
                     // steady upward drag works as well as a quick flick; any
                     // downward movement resets it, so it takes a genuine
                     // upward gesture and not incidental wander.
  JUMP_FALL_CROSSFADE: 0.30,  // sec. The jump clip ends at its apex with the
                     // hips at 1.478 and the landing clip opens grounded at
                     // 0.907 — there is no falling phase in either. Blending
                     // between them over this window IS the descent: 0.57
                     // world units in 0.3s, close to what a real fall from
                     // that apex would take (~0.33s), so it reads as gravity
                     // rather than as a cut.
  SLIDE_SPEED: 9.0   // px/ms of raw pointer motion — above this, ANY mouse
                     // move triggers a slide immediately, from whatever state
                     // he's currently in. Raised from 3.5, which fired on
                     // ordinary cursor movement; a slide should take a
                     // deliberate flick. Screen-space and deliberately not
                     // tied to run speed: this reads how fast the user moved
                     // the mouse, not how fast the character moves
};

// ---------------------------------------------------------------- glyph atlas
const GLYPH_PX = 64;
function buildAtlas(ramp) {
  const n = ramp.length;
  const c = document.createElement("canvas");
  c.width = GLYPH_PX * n; c.height = GLYPH_PX;
  const g = c.getContext("2d");
  g.fillStyle = "#000"; g.fillRect(0, 0, c.width, c.height);
  g.fillStyle = "#fff";
  g.font = `${Math.round(GLYPH_PX * 0.86)}px ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace`;
  g.textAlign = "center"; g.textBaseline = "middle";
  for (let i = 0; i < n; i++) {
    g.fillText(ramp[i], i * GLYPH_PX + GLYPH_PX / 2, GLYPH_PX / 2 + 2);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.generateMipmaps = true;
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  tex.magFilter = THREE.LinearFilter;
  tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
  tex.colorSpace = THREE.NoColorSpace;
  return tex;
}

// ---------------------------------------------------------------- ascii pass
// Same technique as the city build: pixelate to a grid, luminance -> ramp
// index, sample the real glyph out of a mipmapped atlas. No depth fog here —
// the runner moves in a shallow, roughly-planar lane, so there's no
// meaningful depth range for it to encode.
const ASCII_FRAG = `
precision highp float;
uniform sampler2D tScene;
uniform sampler2D uAtlas;
uniform vec2 uResolution;
uniform float uGranularity;
uniform float uRampN;
uniform float uGamma;
uniform vec3 uInk;
uniform vec3 uBg;
uniform float uLevelsBlack;
uniform float uLevelsWhite;
varying vec2 vUv;

void main() {
  vec2 division = uResolution / uGranularity;
  vec2 d = 1.0 / division;
  vec2 cellUV = d * (floor(vUv / d) + 0.5);

  vec3 sceneColor = texture2D(tScene, cellUV).rgb;
  float lum = dot(sceneColor, vec3(0.299, 0.587, 0.114));
  lum = clamp((lum - uLevelsBlack) / (uLevelsWhite - uLevelsBlack), 0.0, 1.0);
  lum = pow(lum, uGamma);

  float charIndex = floor(lum * (uRampN - 1.0) + 0.5);
  vec2 local = fract(vUv / d);
  vec2 atlasUV = vec2((charIndex + local.x) / uRampN, local.y);

  float ink = texture2D(uAtlas, atlasUV).r;
  gl_FragColor = vec4(mix(uBg, uInk, ink), 1.0);
}`;
const ASCII_VERT = `
varying vec2 vUv;
void main() { vUv = uv; gl_Position = vec4(position, 1.0); }`;

// ---------------------------------------------------------------- scene
const canvas = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setClearColor(0x000000, 1);

const scene = new THREE.Scene();
// Height and look-at are set in resize(), derived from ORTHO_HEIGHT so the
// ground line stays pinned to the bottom of the stage at any scale.
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.05, 20);
camera.position.set(0, 1, CONFIG.CAM_Z);

const key = new THREE.DirectionalLight(0xffffff, CONFIG.KEY_INTENSITY);
key.position.set(...CONFIG.KEY_DIR);
const fill = new THREE.AmbientLight(0xffffff, CONFIG.FILL_INTENSITY);
scene.add(key, fill);

let sceneRT = new THREE.WebGLRenderTarget(2, 2, { colorSpace: THREE.SRGBColorSpace });

const atlasTex = buildAtlas(CONFIG.RAMP);
const asciiMat = new THREE.ShaderMaterial({
  uniforms: {
    tScene: { value: sceneRT.texture },
    uAtlas: { value: atlasTex },
    uResolution: { value: new THREE.Vector2(1, 1) },
    uGranularity: { value: 10 },
    uRampN: { value: CONFIG.RAMP.length },
    uGamma: { value: CONFIG.GAMMA },
    uInk: { value: new THREE.Vector3(...CONFIG.INK) },
    uBg: { value: new THREE.Vector3(...CONFIG.BG) },
    uLevelsBlack: { value: CONFIG.LEVELS_BLACK },
    uLevelsWhite: { value: CONFIG.LEVELS_WHITE }
  },
  vertexShader: ASCII_VERT,
  fragmentShader: ASCII_FRAG,
  depthTest: false, depthWrite: false
});
const asciiScene = new THREE.Scene();
const asciiCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
asciiScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), asciiMat));

// ---------------------------------------------------------------- character
// MOVE replaces the old separate WALK and RUN states: one locomotion state
// whose gait is a continuous blend rather than a discrete choice.
const STATE = {
  IDLE: "idle", MOVE: "move", STOP: "stop", SLIDE: "slide",
  JUMP: "jump", LAND: "land"
};
let state = STATE.IDLE;
let charRoot = null, mixer = null;
const actions = {};
let activeAction = null;
let charX = 0, targetX = 0, facing = 1;
let stopStartX = 0, stopTargetX = 0;
let slideStartX = 0, slideDir = 1;
let lastPX = null, lastPT = 0, lastSpeed = 0;
// Upward pointer travel banked since the last downward move — see
// CONFIG.JUMP_RISE_PX.
let lastPY = null, riseAccum = 0;
// Shared gait clock, in cycles. Both locomotion clips read their time from
// this, which is what keeps them in step with each other and with the ground.
let movePhase = 0, moveSpeed = 0, moveGate = 0;
// World-space distances each clip's own root motion covers, measured at load
// (see rootTravel). Driving movement at these rates is what keeps the feet
// planted instead of skating — the character covers exactly the ground the
// animation was authored to cover.
const travel = { run: 0, slide: 0, stop: 0, walk: 0, runSpeed: 0, walkSpeed: 0 };
// Normalised forward-motion curves for the one-shot clips, captured at load
// (see rootCurve). Position follows these rather than a linear ramp, so the
// character eases and plants exactly when the animation does.
const curves = { slide: null, stop: null };

// Cyclic piecewise-linear map from walk-cycle phase to run-cycle phase, built
// from the two measured contact pairs so both feet land together across the
// blend. Monotonic and wraps, so f(p + 1) === f(p) + 1.
function warpPhase(p) {
  const [a, b] = CONFIG.PHASE_WARP;
  p = ((p % 1) + 1) % 1;
  if (p >= a.w && p < b.w) {
    return a.r + ((p - a.w) / (b.w - a.w)) * (b.r - a.r);
  }
  // the segment that straddles the wrap point
  const pw = p < a.w ? p + 1 : p;
  return b.r + ((pw - b.w) / ((a.w + 1) - b.w)) * ((a.r + 1) - b.r);
}

// Progress 0..1 along a captured curve at clip time t.
function sampleCurve(curve, t) {
  if (!curve || !curve.times.length) return 0;
  const { times, prog } = curve;
  if (t <= times[0]) return prog[0];
  const last = times.length - 1;
  if (t >= times[last]) return prog[last];
  for (let i = 1; i <= last; i++) {
    if (t <= times[i]) {
      const a = times[i - 1], b = times[i];
      const f = b > a ? (t - a) / (b - a) : 0;
      return prog[i - 1] + (prog[i] - prog[i - 1]) * f;
    }
  }
  return prog[last];
}
// Half-width of the visible band, minus a margin — set per resize. The slide
// covers 6.4 world units against a band only ~7.9 wide, so without a clamp a
// flick from anywhere but the far side skids him clean out of frame.
let boundX = Infinity;
let ready = false;
const clock = new THREE.Clock();

function fadeToAction(action, duration) {
  // Leaving MOVE: the locomotion pair carries its own manually-set weights and
  // isn't tracked by activeAction, so it has to be faded out explicitly or it
  // would keep contributing underneath whatever comes next.
  if (state === STATE.MOVE) {
    [actions.walk, actions.run].forEach((a) => {
      if (!a || a === action) return;
      // Restore the timeScale first. It is 0 while blending so their time can
      // be written by hand, and isRunning() reports false at timeScale 0 —
      // guarding the fade on it silently skipped the fade and left the walk
      // pinned at full weight underneath idle. Restoring it also lets the
      // legs keep moving through the blend out instead of freezing.
      a.setEffectiveTimeScale(1);
      a.fadeOut(duration);
    });
  }
  const previous = activeAction;
  activeAction = action;
  if (previous && previous !== action) previous.fadeOut(duration);
  action.reset().setEffectiveTimeScale(1).setEffectiveWeight(1)
    .fadeIn(duration).play();
}

function beginIdle() {
  actions.idle.setLoop(THREE.LoopRepeat, Infinity);
  actions.idle.paused = false;
  fadeToAction(actions.idle, CONFIG.IDLE_CROSSFADE);
  state = STATE.IDLE;
}
// The locomotion pair is driven differently from every other clip: both run
// continuously with timeScale 0 and have their time and weight written each
// frame from the shared phase clock, so fadeToAction (which owns a single
// active action) can't manage them. Fade the previous action out by hand and
// let stepState take over the weights.
function beginMove() {
  if (state === STATE.MOVE) return;
  if (activeAction && activeAction !== actions.walk && activeAction !== actions.run) {
    activeAction.fadeOut(CONFIG.CROSSFADE);
  }
  [actions.walk, actions.run].forEach((a) => {
    a.setLoop(THREE.LoopRepeat, Infinity);
    a.enabled = true;
    // Cancel any fade left over from the last exit. A live fade interpolant
    // rewrites the effective weight during mixer.update and would overwrite
    // the weights this state sets by hand every frame.
    a.stopFading();
    a.setEffectiveTimeScale(0);   // time is written manually from movePhase
    if (!a.isRunning()) a.play();
  });
  activeAction = null;            // no single owner while blending
  moveGate = 0;                   // ramps in over CROSSFADE
  moveSpeed = Math.max(moveSpeed, CONFIG.MOVE_MIN_SPEED);
  state = STATE.MOVE;
}
// Jumps in place: the clip's own horizontal travel is 8cm, and the forward
// channel is frozen like every other clip, so he goes straight up from
// wherever he stands rather than tracking the cursor mid-air.
function beginJump() {
  fadeToAction(actions.jump, CONFIG.CROSSFADE);
  riseAccum = 0;
  state = STATE.JUMP;
}
function beginLanding() {
  fadeToAction(actions.land, CONFIG.JUMP_FALL_CROSSFADE);
  state = STATE.LAND;
}
// Precise arrival: lerps from wherever he currently is to the actual target
// over the clip's duration, so he lands exactly on the cursor. Used both for
// a normal run-in stop and for the "close enough after a slide" case.
// Without an explicit target this settles onto the cursor — correct coming
// out of a RUN, which hands over at exactly the stop clip's own travel
// distance. Coming out of a SLIDE the caller passes a target instead, so the
// stop carries its natural distance from wherever the skid ended rather than
// stretching to reach a cursor that may be anywhere.
function beginStop(target) {
  fadeToAction(actions.stop, CONFIG.CROSSFADE);
  stopStartX = charX;
  stopTargetX = target === undefined ? targetX : target;
  state = STATE.STOP;
}
// A slide is a skid with its own momentum, not a precise approach — it
// travels a fixed distance in the given direction regardless of where the
// cursor actually is, and can legitimately overshoot or undershoot. Whatever
// it leaves behind gets resolved afterward (see stepState: SLIDE, on finish).
function beginSlide(dir) {
  facing = dir;
  fadeToAction(actions.slide, CONFIG.CROSSFADE);
  slideStartX = charX;
  slideDir = dir;
  state = STATE.SLIDE;
}

const raycaster = new THREE.Raycaster();
// A plane FACING the camera at the character's depth (z=0) — not a ground
// plane. The camera looks dead level (CAM_Y === LOOK_Y), so a ground plane's
// rays would be nearly parallel to it and intersectPlane() would return null
// or blow up numerically. This plane is roughly perpendicular to the view
// direction instead, which is what a screen-x -> world-x mapping actually
// wants regardless of camera pitch.
const facePlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
function pointerWorldX(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  const ndc = new THREE.Vector2(
    ((clientX - r.left) / r.width) * 2 - 1,
    -((clientY - r.top) / r.height) * 2 + 1
  );
  raycaster.setFromCamera(ndc, camera);
  const hit = new THREE.Vector3();
  return raycaster.ray.intersectPlane(facePlane, hit) ? hit.x : null;
}

// Each move is judged on its own: instantaneous pointer speed decides fast vs
// slow right here, rather than accumulating a peak across a whole approach.
// A fast flick jumps straight into a slide from WHATEVER is currently
// happening — running, stopped, idle, even mid-slide — since the whole point
// is that it's an immediate reaction to a sudden movement, not something that
// waits for the current animation to finish first.
// Factored out from the listener so tests can drive it with an exact,
// pre-computed speed — sub-5ms setTimeout gaps aren't reliable enough in this
// environment to control real elapsed time precisely, so verifying the fast
// path needs a way to bypass performance.now() entirely.
function handleMove(wx, speed, rise) {
  // Clamp to the same bound charX is held to. Without this, a cursor past the
  // edge is a target he can never reach: STOP finishes, IDLE sees a leftover
  // gap, starts a RUN, which immediately hands back to STOP — an endless
  // run/stop cycle in place.
  targetX = Math.max(-boundX, Math.min(boundX, wx));
  lastSpeed = speed;
  if (!ready) return;

  const airborne = state === STATE.JUMP || state === STATE.LAND;

  // Bank upward travel; any downward movement clears it, so the threshold
  // has to be met by a genuinely upward gesture.
  if (rise > 0) riseAccum += rise; else if (rise < 0) riseAccum = 0;
  if (!airborne && riseAccum >= CONFIG.JUMP_RISE_PX) {
    beginJump();
    return;
  }

  // Mid-air the cursor still steers where he'll be headed once he lands
  // (targetX above is already updated), but it can't start a gait.
  if (airborne) return;

  // Nothing starts unless the cursor is genuinely somewhere else. This gates
  // the slide too, not just the run: a fast twitch that covers no ground is
  // jitter, not a flick, and shouldn't fire a full skid.
  const gap = Math.abs(targetX - charX);
  if (gap < CONFIG.MIN_MOVE) return;

  if (speed > CONFIG.SLIDE_SPEED) {
    const dir = Math.sign(targetX - charX) || facing;
    beginSlide(dir);
    return;
  }

  // No gait choice to make here any more — MOVE works out its own pace from
  // the distance left to cover, and blends walk against run to match. This
  // just decides whether locomotion should be running at all.
  if (state === STATE.IDLE) {
    beginMove();
  } else if (state === STATE.STOP) {
    // A slow correction while he's already settling: only worth breaking out
    // of the settle if the cursor moved meaningfully from where he's headed,
    // not for every sub-pixel jiggle of the mouse.
    if (Math.abs(targetX - stopTargetX) > CONFIG.RETRIGGER_DIST) beginMove();
  }
  // MOVE and SLIDE need no further handling: MOVE re-reads targetX every
  // frame in stepState, and a slide's distance is fixed once it starts — a
  // slow move mid-slide is deliberately ignored until it ends.
}

window.addEventListener("pointermove", (e) => {
  const wx = pointerWorldX(e.clientX, e.clientY);
  if (wx === null) return;

  const now = performance.now();
  let speed = 0;
  if (lastPX !== null) {
    const dt = now - lastPT;
    if (dt > 0) speed = Math.abs(e.clientX - lastPX) / dt;
  }
  // Screen y grows downward, so a decrease is upward movement.
  const rise = lastPY === null ? 0 : lastPY - e.clientY;
  lastPX = e.clientX; lastPT = now; lastPY = e.clientY;

  handleMove(wx, speed, rise);
});

new GLTFLoader().loadAsync(CONFIG.MODEL_RUN).then(async (runG) => {
  const [slideG, stopG, walkG, landG] = await Promise.all([
    new GLTFLoader().loadAsync(CONFIG.MODEL_SLIDE),
    new GLTFLoader().loadAsync(CONFIG.MODEL_STOP),
    new GLTFLoader().loadAsync(CONFIG.MODEL_WALK),
    new GLTFLoader().loadAsync(CONFIG.MODEL_LAND)
  ]);

  // The Armature carries a baked x offset (-1.444) from wherever it happened
  // to sit in the authoring scene. Left alone, that offset is INSIDE the node
  // charRoot rotates, so the 0/180 facing flip mirrors it too — measured, he
  // jumped from ~15% to ~80% of frame width purely from turning around, with
  // charRoot.position.x pinned at 0. Zeroing it makes charRoot's origin the
  // character's actual origin, so position and facing stay independent.
  const armature = runG.scene.getObjectByName("Armature");
  if (armature) armature.position.x = 0;

  // --- root motion -------------------------------------------------------
  // These are "with root motion" exports: the hip track carries real
  // locomotion. Measured per-component over each clip, in the rig's raw
  // ~cm units:
  //   local X  run 1.85 / slide 16.7 / stop 5.1   -> lateral sway
  //   local Y  run 360  / slide 642  / stop 81    -> MONOTONIC: forward travel
  //   local Z  run 6.3  / slide 70.2 / stop 22.3  -> OSCILLATES: vertical bob
  // Only local Y is drift worth removing; the app drives position itself.
  // An earlier pass froze all three, which also killed the bob and the
  // slide/stop crouch — and that is what makes feet float and sink, since the
  // hip no longer rises and falls to keep them planted. Freeze Y alone.
  const ROOT_BONE = "mixamorigHips";
  const FORWARD_AXIS = 1;   // local Y, per the measurements above

  // Net forward travel of one clip, expressed in world units — this is how
  // far the animation itself expects the character to move, so driving him at
  // exactly this rate is what stops the feet skating over the ground.
  function rootTravel(clip) {
    const track = clip.tracks.find((t) => t.name === ROOT_BONE + ".position");
    if (!track) return 0;
    const n = track.values.length / 3;
    const first = track.values[FORWARD_AXIS];
    const last = track.values[(n - 1) * 3 + FORWARD_AXIS];
    const scale = armature ? armature.scale.x : 1;
    return Math.abs(last - first) * scale * CONFIG.CHAR_SCALE;
  }
  function freezeForward(clip) {
    const track = clip.tracks.find((t) => t.name === ROOT_BONE + ".position");
    if (!track) return;
    const base = track.values[FORWARD_AXIS];
    for (let i = FORWARD_AXIS; i < track.values.length; i += 3) {
      track.values[i] = base;
    }
  }

  // The forward track's own shape, normalised to 0..1 over the clip. Driving
  // position with THIS instead of a linear ramp is what makes the stop
  // actually stop: the clip decelerates hard and then holds, so a linear ramp
  // keeps sliding the character along at constant speed while the animation
  // has already planted — visible as a skid at the end of every stop.
  function rootCurve(clip) {
    const track = clip.tracks.find((t) => t.name === ROOT_BONE + ".position");
    if (!track) return null;
    const n = track.values.length / 3;
    const vals = [];
    for (let i = 0; i < n; i++) vals.push(track.values[i * 3 + FORWARD_AXIS]);
    const first = vals[0], span = vals[n - 1] - first;
    return {
      times: Array.from(track.times),
      prog: span !== 0 ? vals.map((v) => (v - first) / span) : vals.map(() => 0)
    };
  }

  const runClip = runG.animations[CONFIG.RUN_CLIP_IDX];
  const slideClip = slideG.animations[CONFIG.SLIDE_CLIP_IDX];
  const stopClip = stopG.animations[CONFIG.STOP_CLIP_IDX];
  const walkClip = walkG.animations[CONFIG.WALK_CLIP_IDX];
  const idleClip = walkG.animations[CONFIG.IDLE_CLIP_IDX];
  const jumpClip = landG.animations[CONFIG.JUMP_CLIP_IDX];
  const landClip = landG.animations[CONFIG.LAND_CLIP_IDX];

  // Measure BEFORE freezing — afterwards the travel reads as zero.
  travel.run = rootTravel(runClip);
  travel.slide = rootTravel(slideClip);
  travel.stop = rootTravel(stopClip);
  travel.walk = rootTravel(walkClip);
  travel.runSpeed = runClip.duration > 0 ? travel.run / runClip.duration : CONFIG.RUN_SPEED;
  travel.walkSpeed = walkClip.duration > 0 ? travel.walk / walkClip.duration : CONFIG.RUN_SPEED;
  curves.slide = rootCurve(slideClip);
  curves.stop = rootCurve(stopClip);

  // Idle is included: it has no meaningful forward travel, but it does drift
  // slightly, and left unfrozen that drift would slowly slide a standing
  // character sideways over the clip's 8.8 seconds. Jump and landing are
  // included for the same reason — their forward channels carry 8cm and 17cm
  // respectively, which would otherwise nudge him sideways every jump.
  // Only the forward channel goes: the vertical stays, and for these two it
  // is the whole point — the jump's rise and the landing's absorb both live
  // in it.
  [runClip, slideClip, stopClip, walkClip, idleClip, jumpClip, landClip]
    .forEach(freezeForward);

  charRoot = new THREE.Group();
  runG.scene.traverse((o) => {
    // Same call as the city: the ascii pipeline throws color away entirely,
    // so the baked PBR materials are replaced outright — only geometry,
    // skinning, and normals matter downstream.
    if (o.isMesh) o.material = new THREE.MeshLambertMaterial({ color: 0xffffff });
  });
  charRoot.add(runG.scene);
  charRoot.scale.setScalar(CONFIG.CHAR_SCALE);
  scene.add(charRoot);

  mixer = new THREE.AnimationMixer(runG.scene);
  // Clip tracks are matched to the bound skeleton by BONE NAME, not by which
  // file they came from — since every export shares identical "mixamorig:*"
  // naming, clips from slide/stop/walk apply to run.glb's skeleton with no
  // retargeting step.
  actions.run = mixer.clipAction(runClip);
  actions.slide = mixer.clipAction(slideClip);
  actions.stop = mixer.clipAction(stopClip);
  actions.walk = mixer.clipAction(walkClip);
  actions.idle = mixer.clipAction(idleClip);
  actions.jump = mixer.clipAction(jumpClip);
  actions.land = mixer.clipAction(landClip);
  [actions.slide, actions.stop, actions.jump, actions.land].forEach((a) => {
    a.setLoop(THREE.LoopOnce, 1);
    a.clampWhenFinished = true;
  });

  // Open on the idle loop rather than a held stop frame.
  activeAction = actions.idle;
  actions.idle.setLoop(THREE.LoopRepeat, Infinity);
  actions.idle.play();
  mixer.update(0);

  ready = true;
});

function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  // The stage is sized in vh/vw, so on a cold load this can fire before layout
  // has given it a real box. Sizing to zero here leaves the render target 0
  // wide and the page draws nothing until something else happens to trigger a
  // resize — a blank first paint. Bail and let the observer below re-run it.
  if (!w || !h) return;
  const dpr = renderer.getPixelRatio();
  renderer.setSize(w, h, false);
  sceneRT.setSize(Math.round(w * dpr), Math.round(h * dpr));

  // Orthographic frustum: fixed world height, width follows the band's own
  // aspect ratio — this is what keeps him a constant size regardless of how
  // far into the run he is, instead of shrinking/growing like a perspective
  // camera would.
  const halfH = CONFIG.ORTHO_HEIGHT / 2;
  const halfW = halfH * (w / h);
  boundX = Math.max(0, halfW - CONFIG.EDGE_MARGIN);
  camera.left = -halfW; camera.right = halfW;
  camera.top = halfH; camera.bottom = -halfH;
  // His feet are at world y = 0, so putting the frustum's bottom edge just
  // below that lands him on the stage's lower edge — the ground line the link
  // columns sit under. Derived, not a constant, so it survives scale changes.
  camera.position.y = halfH - CONFIG.GROUND_MARGIN;
  camera.lookAt(0, camera.position.y, 0);
  camera.updateProjectionMatrix();
  asciiMat.uniforms.uResolution.value.set(w * dpr, h * dpr);

  // Character height in CSS px, divided into a constant number of squares —
  // so shrinking the band shrinks the glyphs, not the amount of detail spent
  // on the figure. Orthographic, so this is just a fixed world-to-px ratio,
  // no distance/FOV term needed.
  const charWorldH = 1.8 * CONFIG.CHAR_SCALE; // ~bind-pose height, real meters
  const charPx = (charWorldH / CONFIG.ORTHO_HEIGHT) * h;
  asciiMat.uniforms.uGranularity.value =
    (charPx / CONFIG.GRANULARITY_SQUARES) * dpr;
}
window.addEventListener("resize", resize);
// Catches the case the guard above bails on: the stage getting its real box
// after this script runs. A plain resize listener never fires for that, since
// the window itself never changed size.
if (window.ResizeObserver) new ResizeObserver(resize).observe(canvas);
resize();

// Movement/state-machine step, factored out of the render loop so it can
// also be driven manually (see window.__step) — useful whenever rAF itself
// isn't ticking (backgrounded tab, automated testing) and the render loop
// alone can't be used to verify behavior.
function stepState(dt) {
  if (mixer) mixer.update(dt);
  if (!ready) return;

  if (state === STATE.JUMP) {
    // Airborne: no horizontal drive at all. The clip supplies the whole rise
    // through the vertical channel of its root track.
    if (actions.jump.time >= actions.jump.getClip().duration) beginLanding();
  } else if (state === STATE.LAND) {
    if (actions.land.time >= actions.land.getClip().duration) beginIdle();
  } else if (state === STATE.MOVE) {
    const dx = targetX - charX;
    const dist = Math.abs(dx);

    // Proportional control: speed falls away as the gap closes, so arrival
    // decelerates on its own and needs no separate trigger.
    let want = Math.min(dist * CONFIG.MOVE_GAIN, travel.runSpeed);
    if (dist > CONFIG.MOVE_ARRIVE) want = Math.max(want, CONFIG.MOVE_MIN_SPEED);
    else want = 0;

    // Chase the target speed rather than snapping to it, so a jittery cursor
    // doesn't translate into a jittery gait.
    const k = Math.min(1, CONFIG.SPEED_SMOOTH * dt);
    moveSpeed += (want - moveSpeed) * k;

    if (dist > CONFIG.MOVE_ARRIVE) {
      const dir = Math.sign(dx);
      charX += dir * Math.min(dist, moveSpeed * dt);
      facing = dir;
    } else {
      charX = targetX;
      if (moveSpeed < CONFIG.MOVE_MIN_SPEED * 0.6) { beginIdle(); return; }
    }

    // Gait blend: 0 = pure walk, 1 = pure run, keyed off the speed he is
    // ACTUALLY moving at, not the speed requested. Smoothstepped so the
    // crossing has no hard corners at either end of the band.
    const lo = CONFIG.BLEND_LO, hi = CONFIG.BLEND_HI;
    const t = Math.max(0, Math.min(1, (moveSpeed - lo) / Math.max(1e-6, hi - lo)));
    const w = t * t * (3 - 2 * t);

    // Stride for the blended gait, so the phase advances at the rate that
    // keeps feet planted at ANY blend — the same no-skate rule as before,
    // now interpolated.
    const stride = travel.walk + (travel.run - travel.walk) * w;
    if (stride > 1e-6) movePhase = (movePhase + (moveSpeed * dt) / stride) % 1;

    const wrap = (p) => ((p % 1) + 1) % 1;
    actions.walk.time = wrap(movePhase) * actions.walk.getClip().duration;
    actions.run.time = wrap(warpPhase(movePhase)) * actions.run.getClip().duration;

    moveGate = Math.min(1, moveGate + dt / Math.max(1e-6, CONFIG.CROSSFADE));
    actions.walk.setEffectiveWeight((1 - w) * moveGate);
    actions.run.setEffectiveWeight(w * moveGate);
  } else if (state === STATE.SLIDE) {
    const dur = actions.slide.getClip().duration;
    // Follow the slide's own motion curve, not a linear ramp: the skid is fast
    // at entry and decelerating by the end, and matching that is what keeps
    // the feet with the ground.
    const p = sampleCurve(curves.slide, actions.slide.time);
    charX = slideStartX + slideDir * travel.slide * p;
    if (actions.slide.time >= dur) {
      actions.slide.paused = true;
      actions.slide.time = dur;
      // Straight into the stop, never a run. Chaining a run here produced a
      // brief stutter of run frames between skid and settle; the stop's own
      // forward motion carries him on from where the slide ended. If the
      // cursor is still far off after that, IDLE starts a fresh, full run —
      // which reads as deliberate rather than as a hitch.
      beginStop(charX + slideDir * travel.stop);
    }
  } else if (state === STATE.STOP) {
    const dur = actions.stop.getClip().duration;
    // Same idea, and this is the one that matters most: the stop clip brakes
    // hard and then holds still. A linear ramp kept sliding him at constant
    // speed through that hold — the skid at the end of every stop. Following
    // the curve means he plants exactly when the animation plants.
    const p = sampleCurve(curves.stop, actions.stop.time);
    charX = THREE.MathUtils.lerp(stopStartX, stopTargetX, p);
    if (actions.stop.time >= dur) {
      charX = stopTargetX;
      // The stop clip has played out — hand over to the looping idle. Its
      // last frame is no longer the resting pose, so nothing needs freezing
      // here; beginIdle crossfades out of it.
      beginIdle();
    }
  } else if (state === STATE.IDLE) {
    // Idle loops on its own; movement only resumes in response to an actual
    // pointermove (see the listener above). This check is just a safety net
    // in case targetX and charX ever disagree without an event having fired
    // to reconcile it. Same threshold the pointer handler uses — a tighter
    // one here would re-start movement that handleMove had deliberately
    // declined, defeating the buffer entirely.
    if (Math.abs(targetX - charX) > CONFIG.MIN_MOVE) beginMove();
  }

  // Keep him inside the visible band whatever the state machine wanted. A
  // slide clamped at the edge does skate its feet for the remainder of the
  // clip, but a character that has left the frame entirely is worse.
  charX = Math.max(-boundX, Math.min(boundX, charX));

  if (charRoot) {
    charRoot.position.x = charX;
    charRoot.rotation.y = facing >= 0 ? CONFIG.YAW_RIGHT : CONFIG.YAW_LEFT;
  }
}

function frame() {
  const dt = clock.getDelta();
  // Last line of defence on sizing. resize() bails when the stage has no box
  // yet and the ResizeObserver is meant to re-run it, but if that observer
  // never fires the page renders nothing at all — the worst failure this can
  // have. Comparing the backing store against the client box each frame costs
  // two property reads and makes a blank page impossible.
  if (canvas.clientWidth &&
      canvas.width !== Math.round(canvas.clientWidth * renderer.getPixelRatio())) {
    resize();
  }
  stepState(dt);
  if (ready) {
    renderer.setRenderTarget(sceneRT);
    renderer.render(scene, camera);
    renderer.setRenderTarget(null);
    renderer.render(asciiScene, asciiCamera);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ------------------------------------------------------------- dev hooks
window.__cfg = CONFIG;
window.__mat = asciiMat;
window.__resize = resize;
window.__ready = () => ready;
window.__state = () => state;
window.__charX = () => charX;
window.__actions = () => actions;
window.__scene = () => scene;
window.__charRoot = () => charRoot;
window.__camera = () => camera;
window.__targetX = () => targetX;
window.__pointerWorldX = pointerWorldX;
window.__lastSpeed = () => lastSpeed;
window.__riseAccum = () => riseAccum;
window.__travel = () => travel;
window.__curves = () => curves;
window.__sampleCurve = sampleCurve;
// Drives the exact same decision logic pointermove uses, with an exact,
// caller-supplied speed instead of one derived from real elapsed time.
window.__moveTo = (clientX, clientY, speedPxMs, risePx) => {
  const wx = pointerWorldX(clientX, clientY);
  if (wx !== null) handleMove(wx, speedPxMs || 0, risePx || 0);
  return { targetX, state, riseAccum };
};
// Steps the state machine directly by a fixed dt, bypassing rAF/clock
// entirely. Rendering is separate (see __grab) — this only needs to move
// the logic forward, deterministically, regardless of tab visibility.
window.__step = (dtSec, n) => {
  for (let i = 0; i < (n || 1); i++) stepState(dtSec);
  return { state, charX, targetX };
};
// Neither of these advances the mixer — they just re-render whatever pose
// currently exists. Advancing here too, on top of the real rAF loop (or
// __step, in tests) double-drives mixer time against uncontrolled wall-clock
// deltas, corrupting whatever sequence is actually being verified.
window.__grab = () => {
  renderer.setRenderTarget(sceneRT);
  renderer.render(scene, camera);
  renderer.setRenderTarget(null);
  renderer.render(asciiScene, asciiCamera);
  return canvas.toDataURL();
};
window.__sceneLum = () => {
  renderer.setRenderTarget(sceneRT);
  renderer.render(scene, camera);
  const w = sceneRT.width, h = sceneRT.height;
  const buf = new Uint8Array(w * h * 4);
  renderer.readRenderTargetPixels(sceneRT, 0, 0, w, h, buf);
  renderer.setRenderTarget(null);
  let n = 0, sum = 0, max = 0;
  const hist = new Array(11).fill(0);
  for (let i = 0; i < buf.length; i += 4) {
    if (buf[i] === 0 && buf[i + 1] === 0 && buf[i + 2] === 0) continue;
    const lum = (0.299 * buf[i] + 0.587 * buf[i + 1] + 0.114 * buf[i + 2]) / 255;
    n++; sum += lum; if (lum > max) max = lum;
    hist[Math.min(10, Math.floor(lum * 11))]++;
  }
  return { n, mean: n ? +(sum / n).toFixed(3) : 0, max: +max.toFixed(3), hist };
};
window.__sceneCols = (buckets) => {
  renderer.setRenderTarget(sceneRT);
  renderer.render(scene, camera);
  const w = sceneRT.width, h = sceneRT.height;
  const buf = new Uint8Array(w * h * 4);
  renderer.readRenderTargetPixels(sceneRT, 0, 0, w, h, buf);
  renderer.setRenderTarget(null);
  const n = buckets || 20;
  const cols = new Array(n).fill(0);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      if (buf[i] === 0 && buf[i + 1] === 0 && buf[i + 2] === 0) continue;
      cols[Math.min(n - 1, Math.floor((x / w) * n))]++;
    }
  }
  return { w, h, cols };
};
</script>
</body>
