<script>
(() => {
  "use strict";

  // ---------------------------------------------------------------- config
  const CONFIG = {
    // --- output
    MODE: "ascii",      // "ascii" | "blocks". blocks = lookdev: one flat random
                        // colour per square instead of glyphs, so the lattice
                        // and the coverage ramp are both readable at a glance
    BLOCK_GAP: 1,       // px gutter in blocks mode, makes the grid unambiguous

    // --- pixelation. PIXEL is the square; it never changes size, only opacity.
    PIXEL: 24,          // square size in CSS px — CONSTANT
    SUB: 4,             // ascii glyphs per square axis: 4 => 16 chars a square
    SMOOTH: true,       // false = nearest neighbour. Left ON: the sprite is
                        // DOWNsampled here, so NN aliases rather than
                        // sharpening, and eats thin features
    SS: 4,              // coverage supersamples per square axis — the softness
                        // dial. 1 = one sample per square (breaks the figure);
                        // 4 = soft gradients

    // --- ascii filter
    RAMP: " .:-=+*#%@", // density ramp, sparse -> dense
    CELL_CUTOFF: 0.5,   // a square is all-or-nothing: draw it filled if this
                        // much of it lies on the sprite, else drop it whole.
                        // Tested against OCCUPANCY, never against tone, so a
                        // pale-but-solid square is never mistaken for an edge
    GAMMA: 0.80,        // coverage -> ramp index shaping
    RAMP_FLOOR: 0.35,   // keep faint squares legible instead of near-blank
    MIN_ALPHA: 0.12,    // floor so faint squares still register
    // Opacity contrast, applied to alpha ONLY. Kept separate from GAMMA so
    // depth can be pushed hard without touching glyph count or choice —
    // raising contrast on coverage itself would drop squares under THRESHOLD
    // and eat the silhouette. Pivoted rather than a plain gamma: a gamma pulls
    // the whole figure down (peak alpha fell 225 -> 200 and it went washed
    // out), whereas pivoting near the top holds the front band's weight and
    // drops only what's below it.
    ALPHA_PIVOT: 0.84,  // coverage that keeps its opacity
    ALPHA_CONTRAST: 2.4, // >1 pushes everything below the pivot away, fast
    GRAIN: 0.10,        // slight screen noise on top of the halftone

    // --- sprite keying. The sheet is a screenshot on a light ground, so
    // membership comes from colour distance and TONE comes from luminance —
    // that way the sprite's darker areas stay denser in ascii.
    KEY_DIST: 40,       // colour distance from background that counts as ink
    INK_FLOOR: 0.38,    // lightest sprite tone still reads this solid

    // Material bands, measured off the sheet's actual palette. Straight
    // luminance collided the two leg materials (green L=127, cyan L=134 -> ink
    // 0.67 vs 0.62), so the legs read as one mass. Explicit levels pull them
    // apart. Tune these to re-balance the figure.
    // dark is held below 1.0 deliberately: at 1.0 the front band's multiplier
    // clips and dark/mid and dark/front collapse to the same alpha, killing the
    // depth cue on the sprite's most common material.
    LAYERS: { light: 0.34, cyan: 0.58, green: 0.76, dark: 0.87 },

    // Synthesised depth. NOTE: the sprite encodes no depth of its own — hue is
    // material (both green and cyan appear on BOTH legs) and the left/right
    // luminance gap is ~2, inconsistent in sign. So this is invented lighting,
    // not extracted. Baked in sprite-local x, which stays correct when facing
    // flips because blit() mirrors the whole cel.
    DEPTH_BANDS: [0.80, 1.0, 1.15],  // back, mid, front ink multipliers
    DEPTH_SPLIT: 0.20,  // |normalised x| dividing mid from the outer bands

    // --- character / motion
    HEIGHT: 420,        // max sprite height in CSS px (~17 squares)
    HEIGHT_VH: 0.60,    // ...but never taller than this much of the viewport
    SPEED: 240,         // walk speed, px/sec (constant)
    STRIDE_F: 0.517,    // full cycle distance, as a fraction of height.
                        // 0.81 -> 0.62 (+30%) -> 0.517 (+20% again), so the
                        // cadence is now ~57% faster than the original. Shorter
                        // stride = more cycles per px. SPEED is untouched.
    DEADZONE: 1,        // px — closer than this counts as arrived. Kept tiny so
                        // the cursor doesn't need a minimum nudge to get him
                        // going; the gap below it is closed outright, not walked
    IDLE_FRAME: 2,      // held when standing — frame 2 is the compact pose
    FLIP: true          // mirror on direction. See note: sprite reads front-on
  };

  // Measured off the sheet, not eyeballed: the strip shows 9 slots but only
  // FOUR unique frames — slots 4-7 duplicate 0-3 and slot 8 repeats slot 0
  // (mean luminance diff ~2 vs ~40 for genuinely different frames).
  // mask clips each frame to its own gutters so neighbours can't bleed in;
  // cx is the head centre (rigid across the cycle) and bottom is the ground.
  const SHEET = {
    bg: [209, 213, 224],
    cw: 64, ch: 78,
    frames: [
      { mask: [26, 85],  cx: 57.5, bottom: 75 },
      { mask: [86, 154], cx: 122.5, bottom: 76 },
      { mask: [154, 198], cx: 176, bottom: 76 },
      { mask: [198, 252], cx: 220, bottom: 76 }
    ]
  };
  const NFRAMES = SHEET.frames.length;

  const RAMP_N = CONFIG.RAMP.length - 1;
  const TAU = Math.PI * 2;

  // Fixed 64x64 screen noise, indexed by GLOBAL square coords — the texture
  // stays pinned to the page and the character moves through it.
  const NOISE = new Float32Array(64 * 64);
  for (let i = 0; i < NOISE.length; i++) {
    const n = Math.sin(i * 127.1 + 311.7) * 43758.5453;
    NOISE[i] = n - Math.floor(n);
  }

  // Lookdev palette, indexed by the SAME global square coords as NOISE. Keying
  // to global position (rather than re-rolling per frame) is deliberate: the
  // colours stay pinned to the page and the character slides through them, so
  // any jitter in the lattice is immediately obvious. Per-frame randomness
  // would just strobe and show nothing.
  const hash = (i, a, b, c) => {
    const n = Math.sin(i * a + b) * c;
    return n - Math.floor(n);
  };
  const HUES = new Array(64 * 64);
  for (let i = 0; i < HUES.length; i++) {
    const h = hash(i, 78.233, 12.9898, 43758.5453);
    const s = hash(i, 39.346, 4.1414, 24634.6345);
    const l = hash(i, 93.989, 27.1234, 31415.9265);
    HUES[i] = "hsl(" + Math.floor(h * 360) + " " +
              (52 + Math.floor(s * 38)) + "% " +
              (42 + Math.floor(l * 26)) + "%)";
  }

  // ---------------------------------------------------------------- canvas
  const view = document.getElementById("stage");
  const ctx = view.getContext("2d");
  const off = document.createElement("canvas");
  const octx = off.getContext("2d", { willReadFrequently: true });

  let W = 0, H = 0, dpr = 1, groundY = 0;
  let boxCols = 0, boxRows = 0;
  let charH = 0, stride = 0;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    view.width = Math.round(W * dpr);
    view.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    groundY = Math.round(H * 0.74);

    charH = Math.max(200, Math.min(CONFIG.HEIGHT, H * CONFIG.HEIGHT_VH));
    stride = charH * CONFIG.STRIDE_F;

    const bw = charH * (SHEET.cw / SHEET.ch) * 1.15;
    const bh = charH * 1.06;
    boxCols = Math.ceil(bw / CONFIG.PIXEL) + 3;
    boxRows = Math.ceil(bh / CONFIG.PIXEL) + 3;
    off.width = boxCols * CONFIG.SS;
    off.height = boxRows * CONFIG.SS;

    if (!userMoved) { targetX = W * 0.5; x = W * 0.5; }
  }

  // ---------------------------------------------------------------- state
  let x = 0, targetX = 0;
  let userMoved = false;
  let facing = 1;
  let phase = 0;              // advanced by distance travelled
  let frameIndex = CONFIG.IDLE_FRAME;
  let hold = false, sheetMode = false;
  let last = performance.now();

  window.addEventListener("pointermove", (e) => {
    targetX = e.clientX;
    userMoved = true;
  });
  window.addEventListener("resize", resize);

  // ------------------------------------------------------- sprite decoding
  const cels = [];
  let ready = false;
  let sheetImg = null;

  // Which material band a sprite pixel belongs to. Thresholds come from the
  // sheet's measured palette: two saturated leg materials around hue 100
  // (green) and 193 (cyan), everything else a blue/lavender body split by
  // luminance into highlight and shadow.
  function classify(r, g, b) {
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
    const sat = mx ? (mx - mn) / mx : 0;
    if (sat > 0.45) {
      const dd = mx - mn;
      let h = mx === r ? 60 * (((g - b) / dd) % 6)
            : mx === g ? 60 * ((b - r) / dd + 2)
                       : 60 * ((r - g) / dd + 4);
      h = (h + 360) % 360;
      if (h > 70 && h < 160) return "green";
      if (h >= 160 && h < 205) return "cyan";
    }
    return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? "light" : "dark";
  }

  function prepare(img) {
    const src = document.createElement("canvas");
    src.width = img.width;
    src.height = img.height;
    const sctx = src.getContext("2d", { willReadFrequently: true });
    sctx.drawImage(img, 0, 0);
    const data = sctx.getImageData(0, 0, img.width, img.height).data;

    const [br, bgc, bb] = SHEET.bg;
    const half = SHEET.cw / 2;

    SHEET.frames.forEach((f) => {
      const cel = document.createElement("canvas");
      cel.width = SHEET.cw;
      cel.height = SHEET.ch;
      const cc = cel.getContext("2d");
      const out = cc.createImageData(SHEET.cw, SHEET.ch);
      const x0 = Math.round(f.cx - SHEET.cw / 2);
      const y0 = f.bottom + 1 - SHEET.ch;

      for (let j = 0; j < SHEET.ch; j++) {
        for (let i = 0; i < SHEET.cw; i++) {
          const sx = x0 + i, sy = y0 + j;
          let a = 0;
          if (sx >= f.mask[0] && sx <= f.mask[1] &&
              sx >= 0 && sx < img.width && sy >= 0 && sy < img.height) {
            const p = (sy * img.width + sx) * 4;
            const dist = Math.abs(data[p] - br) +
                         Math.abs(data[p + 1] - bgc) +
                         Math.abs(data[p + 2] - bb);
            if (dist > CONFIG.KEY_DIST) {
              let ink = CONFIG.LAYERS[classify(data[p], data[p + 1], data[p + 2])];
              // depth band: back / mid / front across the sprite's own width
              const nx = (i - half) / half;
              ink *= CONFIG.DEPTH_BANDS[
                nx < -CONFIG.DEPTH_SPLIT ? 0 : nx > CONFIG.DEPTH_SPLIT ? 2 : 1];
              ink = Math.max(0, Math.min(1, ink));
              a = Math.round(255 * (CONFIG.INK_FLOOR + (1 - CONFIG.INK_FLOOR) * ink));
            }
          }
          const q = (j * SHEET.cw + i) * 4;
          // TWO channels, deliberately separated:
          //   rgb   = tone (material + depth shading)
          //   alpha = occupancy (on the sprite at all, yes/no)
          // Baking shading into alpha would make a pale-but-solid pixel
          // indistinguishable from a half-covered edge pixel, and the
          // all-or-nothing cell test needs to tell those apart.
          out.data[q] = out.data[q + 1] = out.data[q + 2] = a;
          out.data[q + 3] = a > 0 ? 255 : 0;
        }
      }
      cc.putImageData(out, 0, 0);
      cels.push(cel);
    });
    ready = true;
  }

  // ---------------------------------------------------------------- frame
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;

    if (!hold) {
      const dx = targetX - x;
      const dist = Math.abs(dx);
      let moving = false;
      if (dist > CONFIG.DEADZONE) {
        const step = Math.min(dist, CONFIG.SPEED * dt);
        const dir = Math.sign(dx);
        x += dir * step;
        facing = dir;
        phase = (phase + (step / stride) * TAU) % TAU;
        moving = true;
      } else if (dist > 0) {
        // Inside the deadzone, walking would just judder in place. Close the
        // last sub-pixel gap outright so he comes to rest exactly on the
        // cursor rather than parking short of it, and don't count it as
        // movement — a jiggling cursor shouldn't drive the walk cycle.
        x = targetX;
      }
      // one cel per stride/NFRAMES px travelled — the sprite advances with the
      // distance covered, not with wall-clock time
      frameIndex = moving
        ? Math.floor((((phase % TAU) + TAU) % TAU) / TAU * NFRAMES) % NFRAMES
        : CONFIG.IDLE_FRAME;
    }

    if (!sheetMode) {
      ctx.clearRect(0, 0, W, H);
      blit(x);
    }
    requestAnimationFrame(frame);
  }

  // Runs all three stages for one sprite at px. Does not clear, so several can
  // be stamped onto one canvas for a contact sheet of the cycle.
  function blit(px) {
    if (!ready) return;
    const P = CONFIG.PIXEL, SS = CONFIG.SS, SUB = CONFIG.SUB;
    const sub = P / SUB;

    // ---- 1. sprite -> offscreen, at one pixel per SS subsample.
    // Snap the sample box to the GLOBAL square lattice so the squares stay put
    // and the character slides through them.
    const w = charH * (SHEET.cw / SHEET.ch);
    const c0 = Math.floor((px - w * 0.62) / P) - 1;
    const r0 = Math.floor((groundY - charH * 1.03) / P) - 1;
    const k = SS / P;

    octx.setTransform(1, 0, 0, 1, 0, 0);
    octx.clearRect(0, 0, off.width, off.height);
    octx.setTransform(k, 0, 0, k, -c0 * P * k, -r0 * P * k);
    if (CONFIG.FLIP && facing < 0) {
      octx.translate(px, 0); octx.scale(-1, 1); octx.translate(-px, 0);
    }
    // set per-draw: the flag resets whenever the canvas is resized
    octx.imageSmoothingEnabled = CONFIG.SMOOTH;
    octx.drawImage(cels[frameIndex], px - w / 2, groundY - charH, w, charH);

    // ---- 2. pixelation filter: each SS x SS block -> occupancy + tone
    const img = octx.getImageData(0, 0, off.width, off.height).data;
    const ow = off.width;
    const inv = 1 / (255 * SS * SS);

    // ---- 3. output filter. Occupancy decides IF a square is drawn (all or
    // nothing); tone decides how it looks — which glyph and what opacity.
    const blocks = CONFIG.MODE === "blocks";
    if (!blocks) {
      ctx.fillStyle = "#16130f";
      ctx.font = (sub * 1.20).toFixed(1) + 'px ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace';
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
    }

    for (let ry = 0; ry < boxRows; ry++) {
      const sqY = (r0 + ry) * P;
      if (sqY < -P || sqY > H + P) continue;
      for (let rx = 0; rx < boxCols; rx++) {
        let aSum = 0, tSum = 0;
        for (let sy = 0; sy < SS; sy++) {
          let idx = ((ry * SS + sy) * ow + rx * SS) * 4;
          for (let sx = 0; sx < SS; sx++, idx += 4) {
            const a = img[idx + 3];
            aSum += a;
            tSum += img[idx] * a;   // alpha-weighted: empty subsamples can't
          }                         // drag the tone down
        }
        // All-or-nothing. The square is either fully populated with glyphs or
        // omitted entirely, so the character never frays into stray characters
        // along its edges.
        const occ = aSum * inv;
        if (occ < CONFIG.CELL_CUTOFF) continue;

        const gx = (c0 + rx) & 63, gy = (r0 + ry) & 63;
        let tone = tSum / aSum / 255;
        tone *= 1 - CONFIG.GRAIN * NOISE[gy * 64 + gx];

        // opacity rides its own curve; glyph choice uses tone directly
        const aTone = Math.max(0, Math.min(1, CONFIG.ALPHA_PIVOT +
          (tone - CONFIG.ALPHA_PIVOT) * CONFIG.ALPHA_CONTRAST));
        ctx.globalAlpha = CONFIG.MIN_ALPHA + (1 - CONFIG.MIN_ALPHA) * aTone;
        const sqX = (c0 + rx) * P;

        if (blocks) {
          ctx.fillStyle = HUES[gy * 64 + gx];
          const g2 = CONFIG.BLOCK_GAP;
          ctx.fillRect(sqX, sqY, P - g2, P - g2);
          continue;
        }

        const shaped = Math.pow(tone, CONFIG.GAMMA);
        const g = CONFIG.RAMP[Math.round((CONFIG.RAMP_FLOOR + (1 - CONFIG.RAMP_FLOOR) * shaped) * RAMP_N)];
        for (let j = 0; j < SUB; j++) {
          for (let i = 0; i < SUB; i++) {
            ctx.fillText(g, sqX + (i + 0.5) * sub, sqY + (j + 0.5) * sub);
          }
        }
      }
    }
    ctx.globalAlpha = 1;
  }

  // ------------------------------------------------------------- dev hooks
  window.__cfg = CONFIG;
  window.__resize = resize;
  window.__mode = (m) => { CONFIG.MODE = m; };
  window.__frame = () => frameIndex;
  window.__x = () => x;
  window.__cels = cels;
  // cels are baked once, so LAYERS/DEPTH_* edits need a re-bake to show up
  window.__rebuild = () => { cels.length = 0; prepare(sheetImg); };
  window.__pose = (n, f) => {
    hold = true; sheetMode = false;
    frameIndex = ((n % NFRAMES) + NFRAMES) % NFRAMES;
    x = W * 0.5; targetX = x;
    if (f) facing = f;
  };
  window.__release = () => { hold = false; sheetMode = false; };
  window.__sheet = (f, which) => {
    hold = true; sheetMode = true; if (f) facing = f;
    const list = which || Array.from({ length: NFRAMES }, (_, i) => i);
    const gap = W / (list.length + 1);
    ctx.clearRect(0, 0, W, H);
    list.forEach((i, slot) => { frameIndex = i; blit(gap * (slot + 1)); });
  };

  // ---------------------------------------------------------------- start
  resize();
  sheetImg = new Image();
  sheetImg.onload = () => { prepare(sheetImg); };
  sheetImg.src = "data:image/png;base64," + window.__SHEET_B64;
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
